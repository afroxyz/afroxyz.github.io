<svg xmlns="http://www.w3.org/2000/svg" id="d3" viewBox="0 0 900 400" role="img" aria-label="Graph of how the eight agents pass work between each other" width="100%" style="height:auto;max-width:840px;display:block;margin-inline:auto">
