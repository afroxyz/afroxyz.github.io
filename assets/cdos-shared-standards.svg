<style>#d1 text{font-family:Arial, sans-serif}#d1 .b{fill:#eae4d6;stroke:#cfc8b6;stroke-width:1.5}#d1 .src{fill:color-mix(in srgb,#2e7e7e 10%,#eae4d6);stroke:#2e7e7e;stroke-width:1.5}#d1 .t{fill:#16150f;font-size:12.5px}#d1 .ti{fill:#16150f;font-size:14px;font-weight:600}#d1 .cap{fill:#514d43;font-size:11px}#d1 .e{fill:none;stroke:#514d43;stroke-width:1.5}#d1 .acc{fill:none;stroke:#2e7e7e;stroke-width:2.5}</style>
