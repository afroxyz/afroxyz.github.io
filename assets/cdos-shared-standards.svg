<svg xmlns="http://www.w3.org/2000/svg" id="d1" viewBox="0 0 900 440" role="img" aria-label="Shared standards and docs feeding eight thin agents" width="100%" style="height:auto;max-width:840px;display:block;margin-inline:auto">
